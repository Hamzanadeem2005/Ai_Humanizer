<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanizeAI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FBF7EE;
            background-image:
                radial-gradient(ellipse at top right, rgba(200, 149, 109, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(141, 132, 119, 0.05) 0%, transparent 50%);
            color: #5A5448;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .cl,
        .cr {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #F4ECD9;
            z-index: 20;
            animation: cOpen 1.0s 2.0s cubic-bezier(0.7, 0, 0.2, 1) forwards;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.05);
        }

        .cl {
            left: 0;
            border-right: 0.5px solid #E5DDC8;
        }

        .cr {
            right: 0;
            border-left: 0.5px solid #E5DDC8;
            animation-name: cOpenR;
        }

        .intro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            opacity: 0;
            animation:
                introIn 0.5s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                introSpin 1.4s 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                introOut 0.4s 2.0s ease-out forwards;
        }

        .intro-name {

        .nav-text {
            font-size: 20px;
            font-weight: 700;
            color: #5A5448;
            letter-spacing: -0.025em;
        }

        .nav-ai {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            font-weight: 500;
            color: #C8956D;
            font-size: 22px;
            margin-left: 2px;
        }

        .nav-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 500;
            color: #8D8477;
            padding: 9px 18px;
            cursor: pointer;
        }

        .nav-cta {
            font-size: 14px;
            font-weight: 500;
            color: #FBF7EE;
            background: #8D8477;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-cta:hover {
            background: #6B6357;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            background: #F4ECD9;
            border: 0.5px solid #E5DDC8;
            border-radius: 100px;
            font-size: 13px;
            color: #8D8477;
            margin-bottom: 32px;
            opacity: 0;
            animation: fu 0.5s 3.2s ease-out forwards;
        }

        .hero-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #C8956D;
            border-radius: 50%;
